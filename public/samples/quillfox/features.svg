<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760"><rect x="0" y="0" width="1440" height="760" rx="0" fill="#FBFAF7" /><text x="120" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="600" fill="#1B1A17" text-anchor="start" letter-spacing="0">Everything in one place</text><text x="120" y="178" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#77736A" text-anchor="start" letter-spacing="0">A short list of the reasons teams switch.</text><rect x="120" y="250" width="380" height="210" rx="16" fill="#F0EDE6" /><rect x="148" y="278" width="44" height="44" rx="22" fill="#D9480F" fill-opacity="0.9"/><text x="148" y="362" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1B1A17" text-anchor="start" letter-spacing="0">Plan together</text><rect x="148" y="386" width="300" height="8" rx="4" fill="#77736A55" /><rect x="148" y="404" width="300" height="8" rx="4" fill="#77736A55" /><rect x="148" y="422" width="180" height="8" rx="4" fill="#77736A55" /><rect x="530" y="250" width="380" height="210" rx="16" fill="#F0EDE6" /><rect x="558" y="278" width="44" height="44" rx="22" fill="#D9480F" fill-opacity="0.9"/><text x="558" y="362" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1B1A17" text-anchor="start" letter-spacing="0">Ship faster</text><rect x="558" y="386" width="300" height="8" rx="4" fill="#77736A55" /><rect x="558" y="404" width="300" height="8" rx="4" fill="#77736A55" /><rect x="558" y="422" width="180" height="8" rx="4" fill="#77736A55" /><rect x="940" y="250" width="380" height="210" rx="16" fill="#F0EDE6" /><rect x="968" y="278" width="44" height="44" rx="22" fill="#D9480F" fill-opacity="0.9"/><text x="968" y="362" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1B1A17" text-anchor="start" letter-spacing="0">Stay in sync</text><rect x="968" y="386" width="300" hei