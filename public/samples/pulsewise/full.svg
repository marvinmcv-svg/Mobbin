80" height="8" rx="4" fill="#6A729955" /><rect x="530" y="250" width="380" height="210" rx="16" fill="#E6E9FB" /><rect x="558" y="278" width="44" height="44" rx="10" fill="#4F46E5" fill-opacity="0.9"/><text x="558" y="362" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#151B3A" text-anchor="start" letter-spacing="0">Ship faster</text><rect x="558" y="386" width="300" height="8" rx="4" fill="#6A729955" /><rect x="558" y="404" width="300" height="8" rx="4" fill="#6A729955" /><rect x="558" y="422" width="180" height="8" rx="4" fill="#6A729955" /><rect x="940" y="250" width="380" height="210" rx="16" fill="#E6E9FB" /><rect x="968" y="278" width="44" height="44" rx="10" fill="#4F46E5" fill-opacity="0.9"/><text x="968" y="362" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#151B3A" text-anchor="start" letter-spacing="0">Stay in sync</text><rect x="968" y="386" width="300" height="8" rx="4" fill="#6A729955" /><rect x="968" y="404" width="300" height="8" rx="4" fill="#6A729955" /><rect x="968" y="422" width="180" height="8" rx="4" fill="#6A729955" /><rect x="120" y="490" width="380" height="210" rx="16" fill="#E6E9FB" /><rect x="148" y="518" width="44" height="44" rx="10" fill="#4F46E5" fill-opacity="0.9"/><text x="148" y="602" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#151B3A" text-anchor="start" letter-spacing="0">Own your data</text><rect x="148" y="626" width="300" height="8" rx="4" fill="#6A729955" /><rect x="148" y="644" width="300" height="8" rx="4" fill="#6A729955" /><rect x="148" y="662" width="180" height="8" rx="4" fill="#6A729955" /><rect x="530" y="490" width="380" height="210" rx="16" fill="#E6E9FB" /><rect x="558" y="518" width="44" height="44" rx="10" fill="#4F46E5" fill-opacity="0.9"/><text x="558" y="602" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#151B3A" text-anchor="start" letter-spacing="0">Automate the dull parts</text><rect x="558" y="626" width="300" height="8" rx="4" fill="#6A729955" /><rect x="558" y="644" width="300" height="8" rx="4" fill="#6A729955" /><rect x="558" y="662" width="180" height="8" rx="4" fill="#6A729955" /><rect x="940" y="490" width="380" height="210" rx="16" fill="#E6E9FB" /><rect x="968" y="518" width="44" height="44" rx="10" fill="#4F46E5" fill-opacity="0.9"/><text x="968" y="602" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#151B3A" text-anchor="start" letter-spacing="0">Measure what matters</text><rect x="968" y="626" width="300" height="8" rx="4" fill="#6A729955" /><rect x="968" y="644" width="300" height="8" rx="4" fill="#6A729955" /><rect x="968" y="662" width="180" height="8" rx="4" fill="#6A729955" /></g><g transform="translate(0 1660)"><rect x="0" y="0" width="1440" height="620" rx="0" fill="#E6E9FB" /><text x="120" y="130" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="600" fill="#151B3A" text-anchor="start" letter-spacing="0">Loved by small teams</text><rect x="120" y="190" width="380" height="340" rx="18" fill="#F5F7FF" /><text x="152" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="400" fill="#4F46E5" text-anchor="start" letter-spacing="0">“</text><rect x="152" y="280" width="310" height="8" rx="4" fill="#6A729977" /><rect x="152" y="302" width="310" height="8" rx="4" fill="#6A729977" /><rect x="152" y="324" width="310" height="8" rx="4" fill="#6A729977" /><rect x="152" y="346" width="310" height="8" rx="4" fill="#6A729977" /><rect x="152" y="368" width="186" height="8" rx="4" fill="#6A729977" /><circle cx="176" cy="470" r="24" fill="#4F46E5" fill-opacity="0.4"/><rect x="212" y="458" width="120" height="10" rx="5" fill="#151B3A" /><rect x="212" y="476" width="80" height="8" rx="4" fill="#6A729988" /><rect x="530" y="190" width="380" height="340" rx="18" fill="#F5F7FF" /><text x="562" y="250" font-family="Georgia, 'Times New Roman', s